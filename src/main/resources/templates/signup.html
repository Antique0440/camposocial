<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | campoSocial</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="brand-header">
        <span class="brand-badge">Campus Network</span>
        <h1>campoSocial</h1>
        <p>Join your university community today.</p>
    </div>

    <div class="card">
        <h2>Create Student Account</h2>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/signup}" method="post" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       th:value="${username}" placeholder="Choose a campus handle" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">University Email</label>
                <input type="email" id="email" name="email"
                       th:value="${email}" placeholder="student@university.edu" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Join campoSocial</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a th:href="@{/login}">Log in here</a>
        </div>
    </div>
</div>
</body>
</html>
