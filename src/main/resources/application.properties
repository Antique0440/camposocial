spring.application.name=campoSocial

# Allowed university email domains for sign-up (comma-separated)
campo.allowed-email-domains=ashesi.edu.gh

# Rate limiting for auth endpoints (attempts allowed per minute per IP)
campo.security.rate-limit.login-per-minute=15
campo.security.rate-limit.signup-per-minute=5
campo.security.rate-limit.enabled=true

# H2 In-Memory DB Configuration (Dev Profile)
spring.datasource.url=jdbc:h2:mem:campodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
