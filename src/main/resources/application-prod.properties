# ====================================================================
# campoSocial Production Profile Configuration (PostgreSQL)
# ====================================================================

# Database credentials injected via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campouser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:campopass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Explicitly disable H2 Console in production
spring.h2.console.enabled=false

# Forward headers strategy for deployments behind reverse proxies (Nginx, Traefik, Caddy, Cloudflare)
server.forward-headers-strategy=framework

